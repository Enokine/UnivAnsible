name: CI

on: [push]

env:
  PIPENV_VENV_IN_PROJECT: 1

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pipenv virtualenv
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-pipenv-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev yamllint ansible-lint "molecule-plugins[docker]"

      - name: Lint Ansible roles and playbooks
        run: |
          pipenv run ansible-lint roles setup_infra.yaml
          pipenv run ansible-lint correct_async.yaml

  molecule:
    needs: linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore pipenv virtualenv from cache
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-pipenv-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install pipenv (if not restored)
        run: python -m pip install --upgrade pip pipenv

      - name: Molecule fix
        run: pipenv run ansible-playbook correct_async.yaml

      - name: Molecule tests
        run: |
          cd roles/WEB
          pipenv run molecule test
